<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohm's Income and Expenses - History</title>
    <link rel="shortcut icon" href="Assets/profile.png" type="image/x-icon">
    <link rel="stylesheet" href="IE25.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"/>
</head>
<body>
    <div class="container">
        <div class="history-box">
            <div class="history-header">
                <div>
                    <h3>ประวัติค่าใช้จ่าย</h3>
                    <div id="billingRange"></div>
                </div>
                <div class="warning-box hidden" id="budgetWarning">
                    <div class="warning-icon" id="warningIcon">
                        ⚠️
                    </div>
                    <div class="warning-content">
                        <h5 id="warningTitle">ระวังค่าใช้จ่าย</h5>
                        <p id="warningText">คุณกำลังใช้จ่ายใกล้เกินงบประมาณแล้ว</p>
                    </div>
                </div>
            </div>
            <div class="budget-box skeleton-card" id="budgetSkeleton">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-bar"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text short"></div>
            </div>
            <div class="budget-box hidden" id="budgetContent">
                <div class="budget-header">
                    <span>งบประมาณเดือนนี้</span>
                    <span id="budgetPercent">ใช้ไป 0%</span>
                </div>
                <div class="budget-bar">
                    <div id="budgetProgress"></div>
                </div>
                <div class="budget-detail">
                    <div>
                        <p>ใช้ไป</p>
                        <b id="budgetUsed">0</b>
                        <p>บาท</p>
                    </div>
                    <div>
                        <p>รายรับทั้งหมด</p>
                        <b id="budgetTotal">0</b>
                        <p>บาท</p>
                    </div>
                    <div>
                        <p>คงเหลือ</p>
                        <b id="sumBalance">0</b>
                        <p>บาท</p>
                    </div>
                </div>
            </div>
            <div class="category-summary">
                <div id="pieSkeleton">
                    <div class="skeleton skeleton-circle"></div>
                    <div class="skeleton-list">
                    <div class="skeleton skeleton-item"></div>
                    <div class="skeleton skeleton-item"></div>
                    <div class="skeleton skeleton-item"></div>
                    <div class="skeleton skeleton-item"></div>
                    </div>
                </div>
                <div id="pieContent" class="hidden">
                    <div class="container">
                        <div class="chart-wrapper">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                    <div id="categoryList"></div>
                </div>
            </div>
            <div class="space-between">
                <h4>รายการล่าสุด</h4>
                <button id="loadMoreBtn" class="load-more"><i class="ph-bold ph-list-plus"></i></button>
            </div>
            <div id="loadingBar"></div>
            <div id="historyList"></div>
            <div class="modal-actions">
                <button onclick="goBack()" id="back"><i class="ph-bold ph-arrow-left"></i>&nbsp;&nbsp;กลับหน้าแรก</button>
                <button id="refreshBtn"><i class="ph-bold ph-arrow-clockwise"></i>&nbsp;&nbsp;อัพเดตใหม่</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="IE_History.js"></script>
</body>
</html>
