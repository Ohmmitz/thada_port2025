<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohm's Income and Expenses - History</title>
    <link rel="shortcut icon" href="Assets/profile.png" type="image/x-icon">
    <link rel="stylesheet" href="IE25.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css"/>
</head>
<body>
    <div class="container">
        <div class="history-box">
            <div class="history-header">
                <div>
                    <h3>ประวัติค่าใช้จ่าย</h3>
                    <div id="billingRange"></div>
                </div>
            </div>
            <div class="budget-box">
                <div class="budget-header">
                    <span>งบประมาณเดือนนี้</span>
                    <span id="budgetPercent">0%</span>
                </div>
                <div class="budget-bar">
                    <div id="budgetProgress"></div>
                </div>
                <div class="budget-detail">
                    ใช้ไป <span id="budgetUsed">0</span> / 
                    <span id="budgetTotal">0</span> บาท
                </div>
            </div>
            <div class="history-summary">
                <div class="onincome">
                    <p>รายรับทั้งเดือน</p>
                    <div>
                        <h3 id="sumIncomeMonth">0</h3>
                        <p>บาท</p>
                    </div>
                </div>
                <div class="onexpense">
                    <p>ค่าใช้จ่ายวันนี้</p>
                    <h3 id="sumExpenseToday">0</h3>
                    <p>บาท</p>
                </div>
                <div class="onexpense">
                    <p>ใช้จ่ายทั้งเดือน</p>
                    <h3 id="sumExpenseMonth">0</h3>
                    <p>บาท</p>
                </div>
                <div class="onbalance">
                    <p>เงินคงเหลือ</p>
                    <h3 id="sumBalance">0</h3>
                    <p>บาท</p>
                </div>
            </div>
            <div class="category-summary">
                <div id="categoryList"></div>
            </div>
            <div class="space-between">
                <h4>รายการล่าสุด</h4>
                <button id="loadMoreBtn" class="load-more"><i class="ph-bold ph-list-plus"></i></button>
            </div>
            <div id="loadingBar"></div>
            <div id="historyList"></div>
            <div class="modal-actions">
                <button onclick="goBack()" id="back"><i class="ph-bold ph-arrow-left"></i>&nbsp;&nbsp;กลับหน้าแรก</button>
                <button id="refreshBtn"><i class="ph-bold ph-arrow-clockwise"></i>&nbsp;&nbsp;อัพเดตใหม่</button>
            </div>
        </div>
    </div>
    <script src="IE_History.js"></script>
</body>
</html>
